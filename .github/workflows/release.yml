name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Notes depuis CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > notes.md
          fi

      - name: Archive de l'arbre device
        run: |
          zip -r "a7y18lte-device-tree-${GITHUB_REF_NAME}.zip" \
            lineage_a7y18lte README.md LICENSE CHANGELOG.md

      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "a7y18lte-device-tree-${GITHUB_REF_NAME}.zip"
