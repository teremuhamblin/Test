name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Makefile syntax
        run: |
          sudo apt-get install -y make
          make -n -f lineage_a7y18lte/lineage_a7y18lte.mk 2>/dev/null ||             echo "Syntax check skipped (Android build env required)"
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
